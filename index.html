<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Air</title>
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  </head>
  <body class="page">
    <header class="header">
      <div class="header__content">
        <div class="header__top">
          <a href="#" class="header__logo">
            <img src="src/images/logo/logo.svg" alt="Air logo">
          </a>
          <a href="#menu" class="header__menu">
            <img src="src/images/menu.svg" alt="Menu link">
          </a>
        </div>

        <aside class="page__menu menu" id="menu">
          <ul class="menu__list">
            <li class="menu__item">
              <a class="menu__link" href="#about-us">About us</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#services">Services</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#testimonials">Testimonials</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#contact-us">Contact Us</a>
            </li>
          </ul>
        </aside>


        <nav class="nav">
          <ul class="nav__list">
            <li class="nav__item">
              <a class="nav__link" href="#about-us">About us</a>
            </li>
            <li class="nav__item">
              <a class="nav__link" href="#services">Services</a>
            </li>
            <li class="nav__item">
              <a class="nav__link" href="#testimonials">Testimonials</a>
            </li>
            <li class="nav__item">
              <a class="nav__link" href="#contact-us">Contact Us</a>
            </li>
          </ul>
        </nav>

        <a class="header__link nav__link" href="#">Hire us</a>
      </div>

      <h1 class="header__title">Strategic Agency</h1>
      <p class="header__text">
        We believe in the power of bold ideas that can solve business challenges.
      </p>

      <div class="header__button__container">
        <button class="button header__button">
          Learn more
        </button>
      </div>


      <div class="slider">
        <div class="slider__content">
          <div class="slider__arrows">
            <button class="slider__arrow slider__arrow--left">
              <img src="src/images/slider/arrow-left.svg" alt="slider arrow left">
            </button>
            <button class="slider__arrow slider__arrow--right">
              <img src="src/images/slider/arrow-right.svg" alt="slider arrow right">
            </button>
          </div>
          <div class="slider__text-container">
            <p class="slider__title">Intro</p>
            <p class="slider__text">By the same illusion which lifts the <br> horizon.</p>
          </div>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="about-us" id="about-us">
        <div class="about-us__who-we-are">

        </div>

        <div class="about-us__our-expertise">

        </div>
      </section>
      <section class="services" id="services">
        <div class="services__content">

        </div>

        <div class="services__blocks">

        </div>
      </section>
      <section class="testimonials" id="testimonials">
        <h2 class="testimonials__title">What people say</h2>

        <div class="testimonials__blocks">

        </div>

        <div class="testimonials__apply">

        </div>
      </section>
      <section class="contact-us" id="contact-us">
        <form class="form">
          <h2 class="form__title">

          </h2>
        </form>

        <div class="contact-us__content">
          <h2 class="contact-us__title"></h2>

        </div>
      </section>
    </main>

    <footer class="footer">
      <a href="#" class="header__logo">
        <img src="src/images/logo/logo.svg" alt="Air logo">
      </a>
      <ul>

      </ul>
    </footer>
  </body>
</html>
